#:schema ./swarm.schema.json
# One profile = one world. Copy into <harness>/swarm/swarm.toml and edit.
# Secrets are references (secret:<name> resolved by the profile's secret tool, env:<VAR>),
# never values: Load refuses a token-looking key that holds a literal.

[profile]
name = "example"
state_dir = "state"                       # relative to this file's dir: swarm.db, logs
worktree_root = "~/.swarm/wt/example"     # outside every repo
notify = "echo"                           # command; the message is appended as the last arg
safety = "trusted"                        # trusted (default): guards against mistakes; strict: workers untrusted, OS sandbox
# Secrets live in the OS keystore, never in this file or the daemon's env. A provider key
# (ANTHROPIC_AUTH_TOKEN = "secret:kimi") becomes the CLI's apiKeyHelper; an MCP server's
# secret reaches its process through secret_exec. Any keystore CLI with get/exec works:
# github.com/fortunto2/solo-factory (skills/secrets) is one.
secret_cmd = ["solo", "secret", "get"]
secret_exec = ["solo", "secret", "exec"]
# What swarm stores or forwards outside Claude (gate output, worker notes, notifications)
# goes through this filter first; a failing filter withholds the text.
redact = ["python3", "/path/to/solo-factory/hooks/secret_guard.py", "filter"]

[repos.app]
path = "~/code/app"
main_branch = "main"
gate = ["go vet ./...", "go test ./... -count=1"]
gate_timeout = "15m"
merge = "ff"                              # "pr" leaves swarm/run-<id> for a human to push

[limits]
max_workers = 6
task_wall_clock = "45m"
max_attempts = 4
escalate_after = 2        # a tier-B task that failed twice runs its next attempt at tier A (-1: never)
# On a host shared with other work: new workers and gates start only while this exits 0;
# otherwise its first output line is logged as the reason. Asked every 15 s, off the loop.
# ([t] keeps pgrep from matching this very command line.)
# admit = "if pgrep -f 'nightly-[j]ob' >/dev/null; then echo nightly job runs; exit 1; fi"

# The provider registry. Each entry is one subscription (one account). roles: worker
# (default), reviewer, lead. priority: lower is tried first for a tier. budget_usd_day:
# dollars per UTC day from the CLI's own cost reports; spent, the provider pauses until
# the next UTC midnight. `swarm providers` shows the live state of all of them.
[providers.claude-a]
kind = "claude"
family = "anthropic"
config_dir = "~/.swarm/accounts/claude-a"
slots = 3
tiers = ["S", "A", "B"]
roles = ["lead", "worker", "reviewer"]
priority = 3
models = { S = "claude-fable-5-2", A = "opus", B = "sonnet" }

[providers.codex]
kind = "codex"
family = "openai"
home = "~/.swarm/accounts/codex"   # CODEX_HOME: log in once with CODEX_HOME=<this> codex login
slots = 3
tiers = ["A", "B"]
roles = ["worker", "reviewer"]
priority = 2

[providers.kimi]
kind = "claude"
family = "moonshot"
config_dir = "~/.swarm/accounts/kimi"
env = { ANTHROPIC_BASE_URL = "https://kimi.example.com/anthropic", ANTHROPIC_AUTH_TOKEN = "secret:kimi", ANTHROPIC_MODEL = "k3" }
slots = 4
tiers = ["B"]
priority = 1          # cheapest first for routine work
budget_usd_day = 20

[nodes.laptop]
host = "local"        # the machine this daemon runs on
max_workers = 6
accounts = ["claude-a", "codex", "kimi"]
roles = ["supervisor", "tree"]

# A machine that dials in (`swarm node` there, with its own small profile: docs/nodes.md).
# Its accounts run there; labels are what a task's runs_on can ask for.
# [nodes.gpu-box]
# host = "remote"
# accounts = ["claude-b"]
# labels = ["gpu"]
# max_workers = 2

# Extra read-only MCP servers next to the board. A code + session index pays for itself:
# a worker finds where a name is defined across repos, and what an earlier attempt or a
# past session already tried. solograph (github.com/fortunto2/solograph) is one binary:
[mcp.solograph]
command = "~/.solo/bin/solograph"
args = []
roles = ["worker", "lead"]
tools = ["symbol_search"] # code index only: session and notes search can hold pasted secrets

[hooks]
# reindex the repo after each merge, so the next worker's search sees the merged code
after_merge = ["~/.solo/bin/solograph scan -p {repo} >/dev/null"]
timeout = "2m"

# Scheduled work the coordinator runs (cron, UTC). `swarm jobs` shows the next and last run.
[jobs.nightly-index]
cron = "15 3 * * *"
repo = "app"
run = "make index"
timeout = "20m"
notify = "fail"
spare = true                 # skipped for the night while limits.admit holds

# An agent job: the account works the prompt in the job's directory; its final text is kept.
[jobs.weekly-review]
cron = "0 7 * * 1"
repo = "app"
provider = "claude-a"
prompt = "Run swarm report --since 7d and write three lines: merged, first try, what blocked most."
allowed_tools = ["Bash(swarm report:*)"]
timeout = "15m"
